cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: pickify
      path:
        image: images/
      endpoint: ${S3_ENDPOINT:}
      public-url: ${S3_PUBLIC_URL:}
    stack:
      auto: false
    credentials:
      secret-key: ${S3_SECRET_KEY}
      access-key: ${S3_ACCESS_KEY}