name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickify:${{ github.sha }} .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickify:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickify:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickify:latest

      - name: Substitute environment variables in k8s manifests
        run: |
          export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          export APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          export S3_PUBLIC_URL=${{ secrets.S3_PUBLIC_URL }}
          envsubst < k3s/pickify-app.yaml > k3s/pickify-app-substituted.yaml

      - name: Deploy to k3s
        run: |
          # Create or update pickify-secrets first
          kubectl create secret generic pickify-secrets \
            --from-literal=DB_URL="${{ secrets.DB_URL }}" \
            --from-literal=DB_HOST_NAME="${{ secrets.DB_HOST_NAME }}" \
            --from-literal=DB_HOST_PASSWORD="${{ secrets.DB_HOST_PASSWORD }}" \
            --from-literal=REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
            --from-literal=KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
            --from-literal=REDIRECT_URI="${{ secrets.REDIRECT_URI }}" \
            --from-literal=SCOPE="profile_nickname,account_email" \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            --from-literal=MAIL_STMP_HOST="smtp.gmail.com" \
            --from-literal=MAIL_STMP_PORT="587" \
            --from-literal=MAIL_STMP_USERNAME="${{ secrets.MAIL_STMP_USERNAME }}" \
            --from-literal=MAIL_STMP_PASSWORD="${{ secrets.MAIL_STMP_PASSWORD }}" \
            -n pickify \
            --dry-run=client -o yaml | kubectl apply -f -

          # Apply namespace, configmap, deployment, service, ingress
          kubectl apply -f k3s/pickify-app-substituted.yaml

          # Force pod restart to pick up new secrets/configmap
          kubectl rollout restart deployment/pickify-app -n pickify

          # Cleanup
          rm -f k3s/pickify-app-substituted.yaml
