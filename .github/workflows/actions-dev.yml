name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pickify:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pickify:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Substitute environment variables in k8s manifests
        run: |
          export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          export APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          envsubst < k3s/pickify-app.yaml > k3s/pickify-app-substituted.yaml

      - name: Copy manifest to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USER }}
          key: ${{ secrets.K3S_SSH_KEY }}
          source: "k3s/pickify-app-substituted.yaml"
          target: "/tmp"
          strip_components: 1

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USER }}
          key: ${{ secrets.K3S_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DB_URL,DB_HOST_NAME,DB_HOST_PASSWORD,REDIS_HOST,JWT_SECRET,CLIENT_ID,CLIENT_SECRET,REDIRECT_URI,S3_ACCESS_KEY,S3_SECRET_KEY,MAIL_STMP_USERNAME,MAIL_STMP_PASSWORD,IMAGE_TAG
          script: |
            # Apply namespace, configmap, deployment, service, ingress
            kubectl apply -f /tmp/pickify-app-substituted.yaml

            # Create or update pickify-secrets
            kubectl create secret generic pickify-secrets \
              --from-literal=DB_URL="$DB_URL" \
              --from-literal=DB_HOST_NAME="$DB_HOST_NAME" \
              --from-literal=DB_HOST_PASSWORD="$DB_HOST_PASSWORD" \
              --from-literal=REDIS_HOST="$REDIS_HOST" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=CLIENT_ID="$CLIENT_ID" \
              --from-literal=CLIENT_SECRET="$CLIENT_SECRET" \
              --from-literal=REDIRECT_URI="$REDIRECT_URI" \
              --from-literal=SCOPE="profile_nickname,account_email" \
              --from-literal=S3_ACCESS_KEY="$S3_ACCESS_KEY" \
              --from-literal=S3_SECRET_KEY="$S3_SECRET_KEY" \
              --from-literal=MAIL_STMP_HOST="smtp.gmail.com" \
              --from-literal=MAIL_STMP_PORT="587" \
              --from-literal=MAIL_STMP_USERNAME="$MAIL_STMP_USERNAME" \
              --from-literal=MAIL_STMP_PASSWORD="$MAIL_STMP_PASSWORD" \
              -n pickify \
              --dry-run=client -o yaml | kubectl apply -f -

            # Update deployment image
            kubectl set image deployment/pickify-app \
              pickify=${DOCKERHUB_USERNAME}/pickify:${IMAGE_TAG} \
              -n pickify

            # Cleanup
            rm -f /tmp/pickify-app-substituted.yaml
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_HOST_NAME: ${{ secrets.DB_HOST_NAME }}
          DB_HOST_PASSWORD: ${{ secrets.DB_HOST_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          MAIL_STMP_USERNAME: ${{ secrets.MAIL_STMP_USERNAME }}
          MAIL_STMP_PASSWORD: ${{ secrets.MAIL_STMP_PASSWORD }}
